# Builds and pushes a multi-arch Docker image to ghcr.io for a given version.
# Called by release.yml after creating a tag, or manually via workflow_dispatch.
# Idempotent: skips the build if the image already exists in the registry.
name: Publish
run-name: Publish ${{ inputs.version }}

on:
  # Called from release.yml after tag creation.
  workflow_call:
    inputs:
      version:
        description: 'BuildKit version tag to publish (e.g. v0.29.0)'
        required: true
        type: string
      latest-version:
        description: 'Highest upstream version — used for latest Docker tag'
        required: false
        type: string
        default: ''
  # Manual escape hatch for one-off publishes.
  workflow_dispatch:
    inputs:
      version:
        description: 'BuildKit version tag to publish (e.g. v0.29.0)'
        required: true
        type: string
      latest-version:
        description: 'Highest upstream version — used for latest Docker tag'
        required: false
        type: string

# Queue (don't cancel) concurrent publishes — each version must be built.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Run inside the act runner image for consistent tooling (Docker, Buildx, etc.).
    container:
      image: catthehacker/ubuntu:act-24.04@sha256:9a257bf2cdeaf1070460687abce446ff2a4263a3112eb0efbe4f7d16ddfb83f5
    env:
      DOCKER_CONFIG: '/root/.docker/'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}

      # Idempotency guard: if the image already exists in ghcr.io, skip the
      # entire build. This prevents duplicate pushes on workflow re-runs.
      - name: Check image exists
        id: check
        shell: bash
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Strip the leading "v" from the tag (e.g. v0.28.1 -> 0.28.1).
          TAG="${VERSION#v}"

          # Validate semver format to guard against malformed tags.
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG"
            exit 1
          fi

          # docker manifest inspect returns 0 if the image exists.
          if docker manifest inspect "ghcr.io/${REPO}:${TAG}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image ghcr.io/${REPO}:${TAG} already exists, skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # All remaining steps are skipped if the image already exists.
      - name: Set up Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4
        with:
          use: true
          platforms: linux/amd64,linux/arm64

      # Generate OCI image tags: full semver (0.28.1) and major.minor (0.28).
      # The major.minor tag is a moving tag that always points to the latest patch.
      # The 'latest' tag is only added when this version matches the highest
      # upstream version, as computed by the update workflow.
      - name: OCI metadata
        if: steps.check.outputs.exists == 'false'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ inputs.version == inputs.latest-version }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
          labels: |
            org.opencontainers.image.description=A buildkit runner

      - name: OCI login
        if: steps.check.outputs.exists == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # Use the built-in GITHUB_TOKEN for ghcr.io authentication.
          # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build linux/amd64 + linux/arm64 and push to ghcr.io.
      - name: OCI build
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          build-args: BUILDKIT_TAG=${{ inputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
