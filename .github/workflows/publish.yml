name: Publish
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: catthehacker/ubuntu:act-24.04@sha256:9a257bf2cdeaf1070460687abce446ff2a4263a3112eb0efbe4f7d16ddfb83f5
    env:
      DOCKER_CONFIG: '/root/.docker/'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Read BuildKit version
        id: buildkit
        shell: bash
        run: |
          set -euo pipefail
          
          # Read BuildKit version to pass as build arg
          VERSION=$(tr -d '[:space:]' < BUILDKIT_VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check if image exists
        id: check
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          
          # Extract version from tag (e.g., refs/tags/v0.28.1 -> 0.28.1)
          TAG="${GITHUB_REF#refs/tags/v}"
          
          # Validate tag format
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG"
            exit 1
          fi
          
          # Check if image already exists in registry to avoid duplicate builds
          if docker manifest inspect "ghcr.io/${REPO}:${TAG}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image ghcr.io/${REPO}:${TAG} already exists, skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4
        with:
          use: true
          platforms: linux/amd64,linux/arm64
      - name: OCI metadata
        if: steps.check.outputs.exists == 'false'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.description=A buildkit runner
      - name: OCI login
        if: steps.check.outputs.exists == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # Use the built-in GitHub action token for authentication with ghcr
          # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: OCI build
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          build-args: BUILDKIT_TAG=${{ steps.buildkit.outputs.version }}
          # Only push package if triggered by tag and prevent anyone from creating tags using tag-protection for this repository
          # https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/managing-repository-settings/configuring-tag-protection-rules
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
