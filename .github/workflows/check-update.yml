name: Check Update
run-name: Check Update

on:
  schedule:
    # Run daily at 6:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Get latest BuildKit release
        id: buildkit
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          
          # Get latest stable release (exclude pre-releases like rc, beta, alpha)
          LATEST=$(gh api repos/moby/buildkit/releases --jq '[.[] | select(.prerelease == false)][0].tag_name')
          
          # Validate version format (vX.Y.Z)
          if [[ ! "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $LATEST"
            exit 1
          fi
          
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest BuildKit release: $LATEST"

      - name: Get current version
        id: current
        shell: bash
        run: |
          set -euo pipefail
          
          # Read current version from file and strip whitespace
          CURRENT=$(tr -d '[:space:]' < BUILDKIT_VERSION)
          
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT"

      - name: Update BUILDKIT_VERSION
        if: steps.buildkit.outputs.latest != steps.current.outputs.current
        shell: bash
        env:
          NEW_VERSION: ${{ steps.buildkit.outputs.latest }}
        run: |
          set -euo pipefail
          
          # Write the new version to the version file
          printf '%s\n' "$NEW_VERSION" > BUILDKIT_VERSION
          echo "Updated BUILDKIT_VERSION to $NEW_VERSION"

      - name: Create Pull Request
        if: steps.buildkit.outputs.latest != steps.current.outputs.current
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: buildkit-update-${{ steps.buildkit.outputs.latest }}
          commit-message: "chore: update BuildKit to ${{ steps.buildkit.outputs.latest }}"
          title: "Update BuildKit to ${{ steps.buildkit.outputs.latest }}"
          body: |
            Automated update to BuildKit ${{ steps.buildkit.outputs.latest }}

            Release notes: https://github.com/moby/buildkit/releases/tag/${{ steps.buildkit.outputs.latest }}
