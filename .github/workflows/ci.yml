# PR verification workflow. Builds the Docker image (without pushing) to
# catch Dockerfile or build-arg regressions before merging.
name: CI
run-name: CI / ${{ github.event_name }}

on:
  pull_request:
    branches:
      - 'main'

# Cancel older runs for the same PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Use the same container as publish.yml so CI and release builds
    # share identical tooling (Docker, Buildx, etc.).
    container:
      image: catthehacker/ubuntu:act-24.04@sha256:9a257bf2cdeaf1070460687abce446ff2a4263a3112eb0efbe4f7d16ddfb83f5
    env:
      DOCKER_CONFIG: '/root/.docker/'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Resolve the BuildKit version from the latest release tag in this
      # repo, so CI always builds against the most recently published version.
      - name: Resolve BuildKit version
        id: buildkit
        uses: actions/github-script@v8
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            core.info(`Latest release: ${release.tag_name}`);
            core.setOutput('version', release.tag_name);

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          use: true
          platforms: linux/amd64,linux/arm64

      - name: OCI metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=sha,event=branch
          labels: |
            org.opencontainers.image.description=A buildkit runner

      # Build only — never push from PRs.
      - name: OCI build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          build-args: BUILDKIT_TAG=${{ steps.buildkit.outputs.version }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
