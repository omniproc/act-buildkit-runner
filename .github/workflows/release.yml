name: Release
run-name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'BUILDKIT_VERSION'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Read BuildKit version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          
          # Read version from file and strip whitespace
          VERSION=$(tr -d '[:space:]' < BUILDKIT_VERSION)
          
          # Strip 'v' prefix if present (v0.28.1 -> 0.28.1)
          VERSION="${VERSION#v}"
          
          # Validate version format (X.Y.Z)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi
          
          # Output version for use in subsequent steps
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          
          # Check if a release with this version already exists
          # This prevents duplicate releases on repeated pushes
          if gh release view "v${VERSION}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} already exists, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          
          # Create a new GitHub release
          # This also creates the git tag which triggers the publish workflow
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "BuildKit runner with BuildKit v${VERSION}"
