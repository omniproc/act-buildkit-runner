name: Build Release

on:
  push:
    branches:
      - main
    paths:
      - 'BUILDKIT_VERSION'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read BuildKit version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          
          # Read version from file and strip whitespace
          VERSION=$(tr -d '[:space:]' < BUILDKIT_VERSION)
          
          # Strip 'v' prefix if present (v0.28.1 -> 0.28.1)
          VERSION="${VERSION#v}"
          
          # Validate version format (X.Y.Z)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi
          
          # Output version for use in subsequent steps
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          
          # Check if a release with this version already exists
          # This prevents duplicate releases on repeated pushes
          if gh release view "v${VERSION}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} already exists, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          
          # Create a new GitHub release with auto-generated notes
          # This also creates the git tag which triggers the publish workflow
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "BuildKit runner with BuildKit v${VERSION}" \
            --generate-notes
